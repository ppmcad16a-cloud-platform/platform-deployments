{{- if .Values.networkPolicy.enabled }}
# Firewall for this service's pods: deny ALL incoming traffic except
# - the front door (only if this service has a public route),
# - the services listed in networkPolicy.allowFrom,
# - Prometheus (for /metrics).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ms.name" . }}
  labels:
    {{- include "ms.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ms.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    {{- if .Values.route.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - port: {{ .Values.containerPort }}
    {{- end }}
    {{- with .Values.networkPolicy.allowFrom }}
    - from:
        {{- range . }}
        - podSelector:
            matchLabels:
              app: {{ . }}
        {{- end }}
      ports:
        - port: {{ $.Values.containerPort }}
    {{- end }}
    {{- if .Values.metrics.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: {{ .Values.containerPort }}
    {{- end }}
{{- end }}
