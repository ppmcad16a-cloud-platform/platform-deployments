{{- if .Values.secretEnv }}
# Fetches ONLY this service's secrets from the cloud vault (via the
# "cloud-vault" store installed with the cluster add-ons) into a Kubernetes Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ms.name" . }}-secrets
  labels:
    {{- include "ms.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cloud-vault
  target:
    name: {{ include "ms.name" . }}-secrets
  data:
    {{- range $name, $vaultKey := .Values.secretEnv }}
    - secretKey: {{ $name }}
      remoteRef:
        key: {{ $vaultKey }}
    {{- end }}
{{- end }}
